<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>T04 – SVG House &amp; Garden</title>
  <style>
    body {
      margin: 0;
      padding: 2rem;
      background: #f4f7f5;
      color: #263238;
      font-family: system-ui, sans-serif;
      text-align: center;
    }

    svg {
      display: block;
      width: min(100%, 800px);
      height: auto;
      margin: 1.5rem auto;
      border: 3px solid #536b5b;
      border-radius: 0.5rem;
      background: #dff3ff;
    }
  </style>
</head>
<body>
  <h1>T04 – SVG House &amp; Garden</h1>
  <svg viewBox="0 0 800 500" role="img" aria-labelledby="scene-title scene-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="scene-title">A house and garden on a sunny day</title>
    <desc id="scene-desc">A red-roofed house with a chimney and two windows sits in a green garden. A sun and cloud shine above, with a tree, fence, and curved path nearby.</desc>

    <!-- Sky and grass -->
    <rect x="0" y="0" width="800" height="330" fill="#bfe7ff"/>
    <rect x="0" y="330" width="800" height="170" fill="#8fcf78"/>

    <!-- Sun -->
    <circle cx="690" cy="85" r="42" fill="#ffd34e"/>
    <line x1="690" y1="24" x2="690" y2="10" stroke="#f3a928" stroke-width="5" stroke-linecap="round"/>
    <line x1="690" y1="146" x2="690" y2="160" stroke="#f3a928" stroke-width="5" stroke-linecap="round"/>
    <line x1="629" y1="85" x2="615" y2="85" stroke="#f3a928" stroke-width="5" stroke-linecap="round"/>
    <line x1="751" y1="85" x2="765" y2="85" stroke="#f3a928" stroke-width="5" stroke-linecap="round"/>

    <!-- Cloud -->
    <ellipse cx="153" cy="113" rx="45" ry="25" fill="#fff"/>
    <circle cx="132" cy="101" r="25" fill="#fff"/>
    <circle cx="162" cy="91" r="31" fill="#fff"/>
    <circle cx="188" cy="108" r="22" fill="#fff"/>

    <!-- Tree -->
    <rect x="91" y="262" width="28" height="91" rx="4" fill="#895a3c"/>
    <circle cx="105" cy="232" r="48" fill="#39864a"/>
    <circle cx="76" cy="252" r="31" fill="#4a9b50"/>
    <circle cx="135" cy="253" r="32" fill="#4a9b50"/>

    <!-- House -->
    <rect x="292" y="224" width="248" height="170" fill="#f3c98b" stroke="#704d3a" stroke-width="4"/>
    <polygon points="270,230 416,119 562,230" fill="#b84c3d" stroke="#704d3a" stroke-width="5" stroke-linejoin="round"/>
    <rect x="477" y="145" width="35" height="70" fill="#9b463a" stroke="#704d3a" stroke-width="4"/>
    <rect x="388" y="304" width="58" height="90" fill="#75503b" stroke="#583b2d" stroke-width="4"/>
    <circle cx="433" cy="350" r="4" fill="#f5cf68"/>
    <rect x="317" y="257" width="58" height="53" fill="#aee4f5" stroke="#704d3a" stroke-width="4"/>
    <line x1="346" y1="258" x2="346" y2="309" stroke="#704d3a" stroke-width="3"/>
    <line x1="318" y1="283" x2="374" y2="283" stroke="#704d3a" stroke-width="3"/>
    <rect x="458" y="257" width="58" height="53" fill="#aee4f5" stroke="#704d3a" stroke-width="4"/>
    <line x1="487" y1="258" x2="487" y2="309" stroke="#704d3a" stroke-width="3"/>
    <line x1="459" y1="283" x2="515" y2="283" stroke="#704d3a" stroke-width="3"/>

    <!-- Curved garden path -->
    <path d="M 410 394 C 400 425, 365 450, 350 500 L 510 500 C 480 455, 447 427, 446 394 Z" fill="#e9d8ae"/>

    <!-- Fence -->
    <polyline points="20,370 20,335 48,335 48,370 76,370 76,335 104,335 104,370 132,370 132,335 160,335 160,370 188,370 188,335 216,335 216,370 244,370 244,335 272,335 272,370" fill="none" stroke="#8a603e" stroke-width="6" stroke-linejoin="round"/>
    <line x1="15" y1="350" x2="277" y2="350" stroke="#8a603e" stroke-width="6"/>

    <text x="400" y="475" fill="#28563a" font-size="22" font-weight="600" text-anchor="middle">Home in the garden</text>
  </svg>
</body>
</html>
