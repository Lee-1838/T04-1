<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>T04 – SVG House &amp; Garden</title>
  <style>
    body {
      margin: 0;
      padding: 2rem;
      background: #f4f7f5;
      color: #263238;
      font-family: system-ui, sans-serif;
      text-align: center;
    }

    svg {
      display: block;
      width: min(100%, 800px);
      height: auto;
      margin: 1.5rem auto;
      border: 3px solid #536b5b;
      border-radius: 0.5rem;
      background: #dff3ff;
    }

    #scene-annotated #annotations {
      font-size: 12px;
      fill: #333;
      stroke: #999;
      stroke-width: 1;
      pointer-events: none;
    }

    #scene-annotated #annotations .annotation-label {
      fill: #333;
      stroke: #fff;
      stroke-width: 3;
      paint-order: stroke;
    }

    #scene-annotated #annotations .annotation-callout {
      fill: none;
      stroke: #666;
      stroke-width: 1;
      pointer-events: none;
    }

    #scene-annotated #annotations .annotation-label {
      pointer-events: none;
    }

    /* Step 3 contrast and line-weight adjustments stay within the new SVG. */
    #scene-adjusted .sky {
      fill: #a9d8f0;
    }

    #scene-adjusted .lawn {
      fill: #72b35b;
    }

    #scene-adjusted .tree-trunk {
      fill: #60402d;
    }

    #scene-adjusted .tree-canopy {
      fill: #28683a;
      stroke: #1d512d;
      stroke-width: 2;
    }

    #scene-adjusted .house-wall {
      fill: #f5ce8d;
      stroke: #493426;
      stroke-width: 5;
    }

    #scene-adjusted .roof {
      fill: #a6372e;
      stroke: #493426;
      stroke-width: 6;
    }

    #scene-adjusted .chimney {
      fill: #87372e;
      stroke: #493426;
      stroke-width: 4;
    }

    #scene-adjusted .window {
      fill: #8bd1e8;
      stroke: #493426;
      stroke-width: 4;
    }

    #scene-adjusted .window-detail {
      stroke: #493426;
      stroke-width: 3;
    }

    #scene-adjusted .fence {
      stroke: #684321;
      stroke-width: 5;
      stroke-dasharray: 10 5;
    }

    #scene-adjusted .garden-path {
      fill: #c6b99b;
      stroke: #786b55;
      stroke-width: 2;
    }

    #scene-adjusted .path-stones {
      fill: none;
      stroke: #8e816b;
      stroke-width: 2;
    }

    #scene-adjusted .mailbox {
      fill: #315d78;
      stroke: #243f51;
      stroke-width: 2;
    }

    #scene-adjusted .smoke {
      fill: #fff;
      fill-opacity: 0.72;
      stroke: #a6b0b4;
      stroke-width: 1;
    }
  </style>
</head>
<body>
  <h1>T04 – SVG House &amp; Garden</h1>
  <figure id="scene-original">
  <svg viewBox="0 0 800 500" role="img" aria-labelledby="scene-title scene-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="scene-title">A house and garden on a sunny day</title>
    <desc id="scene-desc">A red-roofed house with a chimney and two windows sits in a green garden. A sun and cloud shine above, with a tree, fence, and curved path nearby.</desc>

    <!-- Sky and grass -->
    <rect x="0" y="0" width="800" height="330" fill="#bfe7ff"/>
    <rect x="0" y="330" width="800" height="170" fill="#8fcf78"/>

    <!-- Sun -->
    <circle cx="690" cy="85" r="42" fill="#ffd34e"/>
    <line x1="690" y1="24" x2="690" y2="10" stroke="#f3a928" stroke-width="5" stroke-linecap="round"/>
    <line x1="690" y1="146" x2="690" y2="160" stroke="#f3a928" stroke-width="5" stroke-linecap="round"/>
    <line x1="629" y1="85" x2="615" y2="85" stroke="#f3a928" stroke-width="5" stroke-linecap="round"/>
    <line x1="751" y1="85" x2="765" y2="85" stroke="#f3a928" stroke-width="5" stroke-linecap="round"/>

    <!-- Cloud -->
    <ellipse cx="153" cy="113" rx="45" ry="25" fill="#fff"/>
    <circle cx="132" cy="101" r="25" fill="#fff"/>
    <circle cx="162" cy="91" r="31" fill="#fff"/>
    <circle cx="188" cy="108" r="22" fill="#fff"/>

    <!-- Tree -->
    <rect x="91" y="262" width="28" height="91" rx="4" fill="#895a3c"/>
    <circle cx="105" cy="232" r="48" fill="#39864a"/>
    <circle cx="76" cy="252" r="31" fill="#4a9b50"/>
    <circle cx="135" cy="253" r="32" fill="#4a9b50"/>

    <!-- House -->
    <rect x="292" y="224" width="248" height="170" fill="#f3c98b" stroke="#704d3a" stroke-width="4"/>
    <polygon points="270,230 416,119 562,230" fill="#b84c3d" stroke="#704d3a" stroke-width="5" stroke-linejoin="round"/>
    <rect x="477" y="145" width="35" height="70" fill="#9b463a" stroke="#704d3a" stroke-width="4"/>
    <rect x="388" y="304" width="58" height="90" fill="#75503b" stroke="#583b2d" stroke-width="4"/>
    <circle cx="433" cy="350" r="4" fill="#f5cf68"/>
    <rect x="317" y="257" width="58" height="53" fill="#aee4f5" stroke="#704d3a" stroke-width="4"/>
    <line x1="346" y1="258" x2="346" y2="309" stroke="#704d3a" stroke-width="3"/>
    <line x1="318" y1="283" x2="374" y2="283" stroke="#704d3a" stroke-width="3"/>
    <rect x="458" y="257" width="58" height="53" fill="#aee4f5" stroke="#704d3a" stroke-width="4"/>
    <line x1="487" y1="258" x2="487" y2="309" stroke="#704d3a" stroke-width="3"/>
    <line x1="459" y1="283" x2="515" y2="283" stroke="#704d3a" stroke-width="3"/>

    <!-- Curved garden path -->
    <path d="M 410 394 C 400 425, 365 450, 350 500 L 510 500 C 480 455, 447 427, 446 394 Z" fill="#e9d8ae"/>

    <!-- Fence -->
    <polyline points="20,370 20,335 48,335 48,370 76,370 76,335 104,335 104,370 132,370 132,335 160,335 160,370 188,370 188,335 216,335 216,370 244,370 244,335 272,335 272,370" fill="none" stroke="#8a603e" stroke-width="6" stroke-linejoin="round"/>
    <line x1="15" y1="350" x2="277" y2="350" stroke="#8a603e" stroke-width="6"/>

    <text x="400" y="475" fill="#28563a" font-size="22" font-weight="600" text-anchor="middle">Home in the garden</text>
  </svg>
    <figcaption>Original scene</figcaption>
  </figure>

  <figure id="scene-annotated-figure">
  <svg id="scene-annotated" viewBox="0 0 800 500" role="img" aria-labelledby="scene-annotated-title scene-annotated-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="scene-annotated-title">A house and garden on a sunny day</title>
    <desc id="scene-annotated-desc">A red-roofed house with a chimney and two windows sits in a green garden. A sun and cloud shine above, with a tree, fence, and curved path nearby.</desc>

    <!-- Sky and grass -->
    <rect x="0" y="0" width="800" height="330" fill="#bfe7ff"/>
    <rect x="0" y="330" width="800" height="170" fill="#8fcf78"/>

    <!-- Sun -->
    <circle cx="690" cy="85" r="42" fill="#ffd34e"/>
    <line x1="690" y1="24" x2="690" y2="10" stroke="#f3a928" stroke-width="5" stroke-linecap="round"/>
    <line x1="690" y1="146" x2="690" y2="160" stroke="#f3a928" stroke-width="5" stroke-linecap="round"/>
    <line x1="629" y1="85" x2="615" y2="85" stroke="#f3a928" stroke-width="5" stroke-linecap="round"/>
    <line x1="751" y1="85" x2="765" y2="85" stroke="#f3a928" stroke-width="5" stroke-linecap="round"/>

    <!-- Cloud -->
    <ellipse cx="153" cy="113" rx="45" ry="25" fill="#fff"/>
    <circle cx="132" cy="101" r="25" fill="#fff"/>
    <circle cx="162" cy="91" r="31" fill="#fff"/>
    <circle cx="188" cy="108" r="22" fill="#fff"/>

    <!-- Tree -->
    <rect x="91" y="262" width="28" height="91" rx="4" fill="#895a3c"/>
    <circle cx="105" cy="232" r="48" fill="#39864a"/>
    <circle cx="76" cy="252" r="31" fill="#4a9b50"/>
    <circle cx="135" cy="253" r="32" fill="#4a9b50"/>

    <!-- House -->
    <rect x="292" y="224" width="248" height="170" fill="#f3c98b" stroke="#704d3a" stroke-width="4"/>
    <polygon points="270,230 416,119 562,230" fill="#b84c3d" stroke="#704d3a" stroke-width="5" stroke-linejoin="round"/>
    <rect x="477" y="145" width="35" height="70" fill="#9b463a" stroke="#704d3a" stroke-width="4"/>
    <rect x="388" y="304" width="58" height="90" fill="#75503b" stroke="#583b2d" stroke-width="4"/>
    <circle cx="433" cy="350" r="4" fill="#f5cf68"/>
    <rect x="317" y="257" width="58" height="53" fill="#aee4f5" stroke="#704d3a" stroke-width="4"/>
    <line x1="346" y1="258" x2="346" y2="309" stroke="#704d3a" stroke-width="3"/>
    <line x1="318" y1="283" x2="374" y2="283" stroke="#704d3a" stroke-width="3"/>
    <rect x="458" y="257" width="58" height="53" fill="#aee4f5" stroke="#704d3a" stroke-width="4"/>
    <line x1="487" y1="258" x2="487" y2="309" stroke="#704d3a" stroke-width="3"/>
    <line x1="459" y1="283" x2="515" y2="283" stroke="#704d3a" stroke-width="3"/>

    <!-- Curved garden path -->
    <path d="M 410 394 C 400 425, 365 450, 350 500 L 510 500 C 480 455, 447 427, 446 394 Z" fill="#e9d8ae"/>

    <!-- Fence -->
    <polyline points="20,370 20,335 48,335 48,370 76,370 76,335 104,335 104,370 132,370 132,335 160,335 160,370 188,370 188,335 216,335 216,370 244,370 244,335 272,335 272,370" fill="none" stroke="#8a603e" stroke-width="6" stroke-linejoin="round"/>
    <line x1="15" y1="350" x2="277" y2="350" stroke="#8a603e" stroke-width="6"/>

    <text x="400" y="475" fill="#28563a" font-size="22" font-weight="600" text-anchor="middle">Home in the garden</text>

    <g id="annotations">
      <g class="annotation-callout">
        <line x1="660" y1="26" x2="674" y2="48"/>
        <line x1="18" y1="158" x2="129" y2="127"/>
        <line x1="545" y1="174" x2="512" y2="180"/>
        <line x1="395" y1="319" x2="346" y2="283"/>
        <line x1="120" y1="405" x2="48" y2="370"/>
        <line x1="530" y1="126" x2="548" y2="216"/>
        <line x1="520" y1="430" x2="473" y2="431"/>
        <line x1="582" y1="462" x2="476" y2="475"/>
      </g>
      <g class="annotation-label">
        <text x="535" y="24">circle cx=690 cy=85 r=42</text>
        <text x="18" y="158">ellipse cx=153 cy=113 rx=45 ry=25</text>
        <text x="545" y="174">rect x=477 y=145 width=35 height=70</text>
        <text x="395" y="319">line (346,258) → (346,309)</text>
        <text x="120" y="405">polyline 20,370 20,335 48,335</text>
        <text x="530" y="126">polygon 270,230 416,119 562,230</text>
        <text x="520" y="430">path M410,394 C400,425 ...</text>
        <text x="582" y="462">text x=400, y=475</text>
      </g>
    </g>
  </svg>
    <figcaption>Annotated scene (Step 2)</figcaption>
  </figure>

  <figure id="scene-adjusted-figure">
  <svg id="scene-adjusted" viewBox="0 0 800 500" role="img" aria-labelledby="scene-adjusted-title scene-adjusted-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="scene-adjusted-title">A house and garden on a sunny day, adjusted</title>
    <desc id="scene-adjusted-desc">A red-roofed house and tree sit in a green garden with a dashed fence, curved stone footpath, mailbox, and chimney smoke.</desc>

    <!-- Improved contrast in the sky and lawn. -->
    <rect class="sky" x="0" y="0" width="800" height="330"/>
    <rect class="lawn" x="0" y="330" width="800" height="170"/>

    <!-- Sun -->
    <circle cx="690" cy="85" r="42" fill="#ffd34e"/>
    <line x1="690" y1="24" x2="690" y2="10" stroke="#e18c18" stroke-width="4" stroke-linecap="round"/>
    <line x1="690" y1="146" x2="690" y2="160" stroke="#e18c18" stroke-width="4" stroke-linecap="round"/>
    <line x1="629" y1="85" x2="615" y2="85" stroke="#e18c18" stroke-width="4" stroke-linecap="round"/>
    <line x1="751" y1="85" x2="765" y2="85" stroke="#e18c18" stroke-width="4" stroke-linecap="round"/>

    <!-- Cloud -->
    <ellipse cx="153" cy="113" rx="45" ry="25" fill="#fff"/>
    <circle cx="132" cy="101" r="25" fill="#fff"/>
    <circle cx="162" cy="91" r="31" fill="#fff"/>
    <circle cx="188" cy="108" r="22" fill="#fff"/>

    <!-- Small translation balances the tree against the house. -->
    <g transform="translate(10 0)">
      <rect class="tree-trunk" x="91" y="262" width="28" height="91" rx="4"/>
      <circle class="tree-canopy" cx="105" cy="232" r="48"/>
      <circle class="tree-canopy" cx="76" cy="252" r="31"/>
      <circle class="tree-canopy" cx="135" cy="253" r="32"/>
    </g>

    <!-- Slightly shift the house and use stronger outlines for definition. -->
    <g transform="translate(8 0)">
      <rect class="house-wall" x="292" y="224" width="248" height="170"/>
      <polygon class="roof" points="270,230 416,119 562,230" stroke-linejoin="round"/>
      <rect class="chimney" x="477" y="145" width="35" height="70"/>
      <ellipse class="smoke" cx="499" cy="137" rx="8" ry="5"/>
      <ellipse class="smoke" cx="507" cy="124" rx="11" ry="7"/>
      <ellipse class="smoke" cx="500" cy="108" rx="14" ry="8"/>
      <rect x="388" y="304" width="58" height="90" fill="#69432f" stroke="#3f2a1e" stroke-width="4"/>
      <circle cx="433" cy="350" r="4" fill="#f5cf68"/>
      <rect class="window" x="317" y="257" width="58" height="53"/>
      <line class="window-detail" x1="346" y1="258" x2="346" y2="309"/>
      <line class="window-detail" x1="318" y1="283" x2="374" y2="283"/>
      <rect class="window" x="458" y="257" width="58" height="53"/>
      <line class="window-detail" x1="487" y1="258" x2="487" y2="309"/>
      <line class="window-detail" x1="459" y1="283" x2="515" y2="283"/>
    </g>

    <!-- Existing garden path and added curved stone walk lead to the shifted door. -->
    <path d="M 410 394 C 400 425, 365 450, 350 500 L 510 500 C 480 455, 447 427, 446 394 Z" fill="#e9d8ae"/>
    <path class="garden-path" d="M 417 394 C 416 424, 400 454, 390 500 L 468 500 C 449 456, 430 424, 430 394 Z"/>
    <path class="path-stones" d="M 406 453 Q 426 448 447 453 M 400 472 Q 425 467 455 472 M 394 490 Q 425 485 461 490"/>

    <!-- Mailbox beside the walk; the fence has a dashed, lighter stroke. -->
    <rect class="mailbox" x="558" y="357" width="6" height="38"/>
    <rect class="mailbox" x="543" y="344" width="36" height="22" rx="2"/>
    <polygon class="mailbox" points="539,344 561,331 583,344"/>
    <rect x="553" y="352" width="16" height="3" fill="#d9e4e8"/>
    <polyline class="fence" points="20,370 20,335 48,335 48,370 76,370 76,335 104,335 104,370 132,370 132,335 160,335 160,370 188,370 188,335 216,335 216,370 244,370 244,335 272,335 272,370" fill="none" stroke-linejoin="round"/>
    <line class="fence" x1="15" y1="350" x2="277" y2="350"/>

    <text x="400" y="475" fill="#23492e" font-size="22" font-weight="600" text-anchor="middle">Home in the garden</text>
  </svg>
    <figcaption>Adjusted scene (Step 3)</figcaption>
  </figure>
</body>
</html>
